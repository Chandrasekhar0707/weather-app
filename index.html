<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather Now</title>
  <meta name="description" content="Lightweight weather app. Enter a city name and see the current temperature.">
  <style>
    :root{
      --bg: #0b1220;          /* deep navy */
      --panel: #121a2b;       /* card background */
      --accent: #4f7cff;      /* electric blue */
      --text: #e8eefc;        /* primary text */
      --muted: #9bb0d3;       /* muted text */
      --ok: #21c55d;          /* success */
      --warn: #f59e0b;        /* warning */
      --err: #ef4444;         /* error */
      --ring: rgba(79,124,255,.35);
      --shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color:var(--text); background: radial-gradient(1200px 800px at 80% -10%, rgba(79,124,255,.15), transparent 60%),
                          radial-gradient(1000px 700px at -10% 20%, rgba(33,197,93,.12), transparent 60%), var(--bg);
      display:grid; place-items:center; padding:24px;
    }
    .app{width:min(920px,100%); display:grid; gap:18px}
    header{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
    }
    .title{font-weight:700; font-size:clamp(22px, 3.5vw, 32px); letter-spacing:.3px}
    .subtitle{color:var(--muted); font-size:14px}

    .card{background:var(--panel); border:1px solid rgba(255,255,255,.06); border-radius:18px; box-shadow:var(--shadow)}

    .search{
      display:grid; grid-template-columns: 1fr auto; gap:10px; padding:14px; align-items:center;
    }
    .input{
      width:100%; padding:14px 14px; border-radius:14px; border:1px solid rgba(255,255,255,.12);
      background:#0f1627; color:var(--text); outline:none; font-size:16px;
      transition:border-color .15s, box-shadow .15s;
    }
    .input:focus{ border-color:var(--accent); box-shadow:0 0 0 6px var(--ring) }

    .btn{
      appearance:none; border:0; border-radius:14px; padding:12px 16px; font-weight:600; cursor:pointer;
      background:linear-gradient(180deg, #5d86ff, #345fff); color:white; box-shadow: 0 8px 20px rgba(79,124,255,.45);
      transition: transform .06s ease-in-out, filter .2s;
    }
    .btn:hover{filter:brightness(1.05)}
    .btn:active{transform:translateY(1px)}

    .results{ display:grid; grid-template-columns: 2fr 1fr; gap:14px; padding:14px }
    @media (max-width: 800px){ .results{ grid-template-columns: 1fr } }

    .primary{ padding:18px; display:grid; gap:14px }
    .locationRow{ display:flex; align-items:center; justify-content:space-between; gap:10px }
    .loc{ font-size:18px; font-weight:600 }
    .time{ color:var(--muted); font-size:13px }

    .tempRow{ display:flex; align-items:center; gap:14px }
    .bigTemp{ font-size:clamp(48px, 9vw, 72px); font-weight:800; letter-spacing:-1px }
    .units{ color:var(--muted); font-weight:600 }
    .cond{ display:flex; align-items:center; gap:10px; color:var(--muted) }
    .cond img{ width:42px; height:42px }

    .miniGrid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:12px }
    .mini{
      background:#0f1627; border:1px dashed rgba(255,255,255,.08); padding:14px; border-radius:14px; display:grid; gap:6px
    }
    .mini .label{ color:var(--muted); font-size:12px }
    .mini .val{ font-weight:700 }

    .side{ padding:18px; display:grid; gap:12px }
    .pill{ display:inline-flex; align-items:center; gap:8px; font-size:12px; padding:8px 10px; border-radius:999px; background:#0f1627; border:1px solid rgba(255,255,255,.08) }

    .hidden{ display:none !important }

    .spinner{ width:22px; height:22px; border:3px solid rgba(255,255,255,.2); border-top-color:white; border-radius:50%; animation:spin .9s linear infinite }
    @keyframes spin{to{transform:rotate(1turn)}}

    .foot{ text-align:center; color:var(--muted); font-size:12px }
    a{ color:var(--accent); text-decoration:none }
  </style>
</head>
<body>
  <main class="app" role="main">
    <header>
      <div>
        <div class="title">Weather Now</div>
        <div class="subtitle">Type any city/town/village and see today's temperature.</div>
      </div>
    </header>

    <section class="card">
      <form id="searchForm" class="search" autocomplete="off">
        <input id="q" class="input" name="q" placeholder="Search location… e.g., London, Delhi, New York" required />
        <button class="btn" id="go" type="submit" aria-label="Get weather">
          <span id="goText">Get Weather</span>
          <span id="goSpin" class="spinner hidden" aria-hidden="true"></span>
        </button>
      </form>
    </section>

    <section id="resultCard" class="card hidden" aria-live="polite">
      <div class="results">
        <div class="primary">
          <div class="locationRow">
            <div class="loc" id="loc">—</div>
            <div class="time" id="time">—</div>
          </div>
          <div class="tempRow">
            <div class="bigTemp" id="temp">—</div>
            <div class="units" id="units">°C</div>
          </div>
          <div class="cond">
            <img id="icon" alt="condition icon" src="" />
            <div id="condition">—</div>
          </div>
          <div class="miniGrid">
            <div class="mini">
              <div class="label">Feels like</div>
              <div class="val" id="feels">—</div>
            </div>
            <div class="mini">
              <div class="label">Humidity</div>
              <div class="val" id="humidity">—</div>
            </div>
            <div class="mini">
              <div class="label">Wind</div>
              <div class="val" id="wind">—</div>
            </div>
          </div>
        </div>
        <aside class="side">
          <div class="pill" id="airPill">AQI: —</div>
          <div class="pill" id="uvPill">UV Index: —</div>
        </aside>
      </div>
    </section>

    <p id="error" class="foot hidden" role="status"></p>
    <p class="foot">Powered by <a href="https://www.weatherapi.com/" target="_blank" rel="noreferrer noopener">WeatherAPI</a>.</p>
  </main>

  <script>
    const API_KEY = "621074866f7e41d782533810252908"; // Provided by you
    const BASE = "http://api.weatherapi.com/v1/current.json";

    const els = {
      form: document.getElementById('searchForm'),
      q: document.getElementById('q'),
      btn: document.getElementById('go'),
      goText: document.getElementById('goText'),
      goSpin: document.getElementById('goSpin'),
      card: document.getElementById('resultCard'),
      loc: document.getElementById('loc'),
      time: document.getElementById('time'),
      temp: document.getElementById('temp'),
      units: document.getElementById('units'),
      icon: document.getElementById('icon'),
      condition: document.getElementById('condition'),
      feels: document.getElementById('feels'),
      humidity: document.getElementById('humidity'),
      wind: document.getElementById('wind'),
      airPill: document.getElementById('airPill'),
      uvPill: document.getElementById('uvPill'),
      error: document.getElementById('error')
    };

    const show = (el) => el.classList.remove('hidden');
    const hide = (el) => el.classList.add('hidden');
    const setLoading = (isLoading) => {
      if(isLoading){ hide(els.goText); show(els.goSpin); els.btn.disabled = true; }
      else { show(els.goText); hide(els.goSpin); els.btn.disabled = false; }
    };

    function formatLocal(dateStr){
      if(!dateStr) return '—';
      const d = new Date(dateStr.replace(' ', 'T'));
      return d.toLocaleString(undefined, { weekday:'short', hour:'2-digit', minute:'2-digit' });
    }

    function aqiCategory(usEpaIndex){
      const map = {1:'Good', 2:'Moderate', 3:'Unhealthy for Sensitive', 4:'Unhealthy', 5:'Very Unhealthy', 6:'Hazardous'};
      return map[usEpaIndex] || '—';
    }

    async function fetchWeather(query){
      const url = `${BASE}?key=${API_KEY}&q=${encodeURIComponent(query)}&aqi=yes`;
      const res = await fetch(url);
      if(!res.ok){
        // Attempt to parse WeatherAPI-style error
        let msg = res.status + ' ' + res.statusText;
        try { const j = await res.json(); if(j && j.error && j.error.message) msg = j.error.message; } catch {}
        throw new Error(msg);
      }
      return res.json();
    }

    function render(data){
      // Basic data
      const { location, current } = data;
      els.loc.textContent = `${location.name}, ${location.region || location.country}`;
      els.time.textContent = `Updated ${formatLocal(location.localtime)}`;

      // Temps
      els.temp.textContent = Math.round(current.temp_c);
      els.units.textContent = '°C';
      els.feels.textContent = `${Math.round(current.feelslike_c)}°C`;

      // Extras
      els.humidity.textContent = `${current.humidity}%`;
      els.wind.textContent = `${Math.round(current.wind_kph)} kph ${current.wind_dir}`;

      // Condition & icon
      els.condition.textContent = current.condition?.text || '—';
      els.icon.src = `https:${current.condition?.icon}`;
      els.icon.alt = current.condition?.text || 'weather icon';

      // AQI + UV
      const aqi = current.air_quality?.["us-epa-index"]; // 1..6
      els.airPill.textContent = `AQI: ${aqi ?? '—'}${aqi ? ' · ' + aqiCategory(aqi) : ''}`;
      els.uvPill.textContent = `UV Index: ${current.uv ?? '—'}`;

      hide(els.error);
      show(els.card);
    }

    function showError(msg){
      els.error.textContent = `⚠️ ${msg}`;
      show(els.error);
      hide(els.card);
    }

    // Form submit
    els.form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = els.q.value.trim();
      if(!query) return;

      setLoading(true);
      try{
        const data = await fetchWeather(query);
        render(data);
        localStorage.setItem('lastLocation', query);
      } catch(err){
        showError(err.message || 'Something went wrong.');
      } finally {
        setLoading(false);
      }
    });

    // Load last searched location (if any)
    (function init(){
      const last = localStorage.getItem('lastLocation') || 'London';
      els.q.value = last;
      // Optionally auto-fetch on load for a friendly first view
      fetchWeather(last).then(render).catch(()=>{});
    })();
  </script>
</body>
</html>
